# 受控分类词表 — PRD 第6章「分类体系（第一版冻结，允许受控扩展）」
#
# AI 不得随意创造新类；需要新增/调整时由人工直接编辑本文件（风格对齐
# sources/registry.yaml 的人工管控模式），不提供“AI自动新增分类”的接口。

industries:
  - 汽车、工程机械与交通装备
  - 数字科技、AI 与通信
  - 电力、新能源与环保
  - 能源、矿产与化工
  - 工业制造、新材料与建材
  - 新能源电池与材料
  - 基础设施、工程建设与园区
  - 轻工、纺织与食品加工
  - 消费品牌、家电与服务业
  - 医疗健康与生物科技
  - 金融科技与支付
  - 商务服务与供应链
  - 其他/待分类

# 动态类型 = 发生了什么
event_types:
  - 签约与战略合作
  - 投资规划与产能布局
  - 市场进入与机构落地
  - 开工建设
  - 项目建设进展
  - 投产与运营
  - 中标或入围
  - 业务拓展
  - 获批运营
  - 并购收购
  - 合资设立
  - 增资扩股
  - 市场表现
  - 政府交流与合作推进
  - 监管与合规风险
  - 基金设立

# 人工投喂来源属性（PRD §4.4），用于判断是否可对外使用
source_attributions:
  - 公开网络
  - 企业官方
  - 活动现场
  - 商务交流
  - 个人观察
  - 待验证

# 项目阶段 = 项目走到了哪里（与动态类型分离，PRD 6.3）
project_stages:
  - 线索发现
  - 市场考察
  - 签约
  - 规划
  - 审批
  - 开工
  - 建设
  - 试产
  - 投产
  - 运营
  - 扩产
  - 暂停或退出
